[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "callx402"
version = "0.1.0"
description = "callx402 by Veyline \u2014 the universal action for x402 infrastructure: diagnose, rescue, route, resolve and execute. Veyline is production infrastructure for x402 + MCP, by Payload."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["x402", "mcp", "x402-production", "x402-monitoring", "x402-routing", "x402-settlement", "x402-rescue", "agent-commerce", "machine-commerce", "payment-infrastructure", "exactly-once", "model-context-protocol"]
authors = [{ name = "Payload" }]

[project.urls]
Homepage = "https://github.com/Payloadhq/callx402"
Repository = "https://github.com/Payloadhq/callx402"

[project.scripts]
callx402 = "callx402.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["callx402*"]

# The bundled node CLI + core (synced into callx402/vendor/ at build time by
# setup.py) so the wheel/sdist is self-contained. Editable installs resolve
# the source-tree siblings instead (see callx402/__init__.py).
[tool.setuptools.package-data]
callx402 = ["vendor/**/*"]
