name: Publish to npm (Trusted Publishing)

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/release-intent/callx402-v1.0.5.txt'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run
      - name: Confirm release version
        run: |
          node -e "if (require('./package.json').version !== '1.0.5') process.exit(1)"
      - name: Check whether version is already published
        id: published
        run: |
          if npm view callx402@1.0.5 version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm via existing Trusted Publishing (OIDC)
        if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public

  github-release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish tagged source release after npm publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.0.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v1.0.5 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "callx402 v1.0.5" --notes "Free read-only MCP diagnostics work from a clean npm installation. Existing configured local/remote subsystems remain available. Financial execution remains disabled through MCP. Release verified by full test suite and npm-pack consumer tests."
          fi
